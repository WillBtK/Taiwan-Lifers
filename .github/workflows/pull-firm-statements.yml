# The statutory filings carry the two numbers the official hedge ratio is made
# of — 傳統避險本金 in the derivatives note, and the components of §三(九)'s
# denominator — and they are the ONLY route to a hedge-ratio history built the
# way the regulation defines it (decisions 4.49, 4.50).
#
# WHY THIS RUNS IN CI AND NOT IN THE SESSION
# doc.twse.com.tw answers with a WAF page ("FOR SECURITY REASONS") rather than
# a 4xx, and it has been blocking the development sandbox's egress IP for hours
# after an early burst. A runner has a different address and no such history.
# The same reasoning already puts probe-rpt-panel here.
#
# The download is a TWO-STEP: step=9 returns a small HTML page linking to
# /pdf/<name>_<timestamp>.pdf with a per-request timestamp, so the URL cannot be
# constructed. Reading that page as "not a PDF" is what stalled the first
# attempt (4.47).
name: pull-firm-statements
on:
  # workflow_dispatch alone is not enough: GitHub only accepts a dispatch for a
  # workflow present on the DEFAULT branch, and this one lives on the feature
  # branch. probe-rpt-panel solves it the same way — a push trigger on the
  # script's own path, so editing the puller runs it.
  # Deliberately NOT triggered by the parser script. Editing the parser used
  # to re-run a 60-minute index and two hours of rate-limited downloads to
  # re-read text the repository already holds; reparse-notes.yml does that
  # part in seconds. Start a real pull by editing THIS file, or by dispatch.
  push:
    branches: [claude/stage-1-fsc-sector-monthly-jh1pkf]
    paths:
      - '.github/workflows/pull-firm-statements.yml'
  workflow_dispatch:
    inputs:
      years:
        description: 'ROC years to index, space separated (blank = 115 down to 105, i.e. 2016-2026)'
        required: false
        default: ''
      gap:
        description: 'seconds between requests'
        required: false
        default: '8'
permissions:
  contents: write
  # download-artifact reads ANOTHER run's artifact, which the default
  # contents-only grant does not allow.
  actions: read
concurrency:
  # ONE GROUP ACROSS EVERY WORKFLOW THAT TOUCHES MOPS. The deck listing and the
  # filing pull ran at once and both were throttled: 324 listing requests took
  # 65 minutes against an 8-second floor, and the index step alongside it
  # crawled. They are the same regulator's website from two runners, and
  # queueing them costs nothing but wall-clock.
  group: mops-traffic
  # FALSE on both, so a queued run waits rather than killing one that is
  # halfway through hours of downloading. The protection this gives up — a
  # push superseding a mistaken harvest — matters much less now the harvest
  # defaults to a one-year listing of about 48 requests.
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stage-1-fsc-sector-monthly-jh1pkf
      # EDITING THIS FILE IS THE ONLY WAY TO START A PULL, which means every
      # edit starts one — including an edit that changes a concurrency group or
      # fixes a comment. One such edit launched a second five-hour download
      # alongside a first that was already half done, against the same
      # regulator's website, and neither could be cancelled from the session
      # that started them.
      #
      # So a commit whose message contains [no-pull] configures the workflow
      # without running it. The guard is a step rather than a job-level `if` so
      # that the run still appears, says why it did nothing, and is not a
      # silent skip.
      - name: Should this commit actually pull?
        id: gate
        run: |
          MSG=$(git log -1 --pretty=%B | head -20)
          if printf '%s' "$MSG" | grep -qF '[no-pull]'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "commit is marked [no-pull]: configuration only, nothing fetched"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
      - name: Install the PDF reader
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet pymupdf
      # REUSE THE PDFS A PREVIOUS RUN ALREADY PAID FOR.
      #
      # Run 34433330818 spent five and a half hours downloading filings and
      # then failed to commit them, but its "Keep the filings" step uploaded
      # every PDF it fetched. The download is the expensive half and those
      # bytes are identical whatever the page filter is, so a re-capture under
      # a widened filter should cost minutes rather than hours and should put
      # no further load on the regulator's website at all.
      #
      # pdf() returns a cached file when one exists, so restoring the artifact
      # into cache/mops_pdf/ is the whole mechanism. Set to a blank string to
      # fetch from MOPS as normal.
      # continue-on-error, not an `if`: a step's own env is not in scope for
      # its own condition, and a missing or expired artifact should cost the
      # run nothing — it falls back to fetching from MOPS.
      - name: Restore the filings a previous run downloaded
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mops-pdfs
          path: cache/mops_pdf/
          run-id: '34433330818'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Say what was restored
        if: steps.gate.outputs.run == 'true'

        run: |
          n=$(ls cache/mops_pdf/*.pdf 2>/dev/null | wc -l)
          echo "$n filings restored from the previous run's artifact"
      # The index is cached in the repo, so a re-run costs only the filings it
      # has not already fetched.
      - name: Index the filings
        if: steps.gate.outputs.run == 'true'
        env:
          TLFX_MOPS_GAP: ${{ github.event.inputs.gap || '8' }}
          TLFX_MOPS_BLOCK_WAIT: '120'
          TLFX_MOPS_MIN_YEAR: '105'
        run: python3 scripts/stage6_firm_sensitivity.py ${{ github.event.inputs.years }}
      # The floor is set on BOTH steps so the download cannot wander outside
      # the range the index was built for, whatever an earlier run left behind.
      - name: Download and parse
        if: steps.gate.outputs.run == 'true'
        env:
          TLFX_MOPS_GAP: ${{ github.event.inputs.gap || '8' }}
          TLFX_MOPS_BLOCK_WAIT: '120'
          TLFX_MOPS_MIN_YEAR: '105'
        run: python3 scripts/stage6_firm_sensitivity.py pull
      # COMMIT THE CAPTURE, NOT THE DERIVED NUMBERS.
      #
      # Run 34433330818 downloaded for five and a half hours, parsed
      # successfully, and lost all of it here: it tried to rebase its generated
      # data files onto a branch that had moved twelve commits, the rebase
      # conflicted on a gzipped JSON that cannot be merged, `|| true` swallowed
      # that, and the push failed.
      #
      # Two changes. The job now REPLANTS its outputs on the current branch tip
      # instead of rebasing onto it — for a generated file the job's copy is
      # authoritative and a three-way merge is meaningless. And it commits only
      # the raw capture: the note text, the filing index, the parsed record.
      # The CSVs are cheap derivatives of that text and are regenerated by
      # whatever parser is current, which also removes the risk of a long run
      # checked out at an old commit overwriting newer extraction with older.
      - name: Commit the captured filings
        if: steps.gate.outputs.run == 'true'

        run: |
          set -e
          BR=claude/stage-1-fsc-sector-monthly-jh1pkf
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          KEEP=$(mktemp -d)
          for f in data/mops_note_text.json.gz reports/mops_filing_index.json \
                   reports/mops_parsed_filings.json; do
            [ -f "$f" ] && install -D "$f" "$KEEP/$f"
          done
          for attempt in 1 2 3; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            (cd "$KEEP" && find . -type f -print0) | while IFS= read -r -d '' f; do
              install -D "$KEEP/${f#./}" "${f#./}"
            done
            git add data/mops_note_text.json.gz reports/mops_filing_index.json \
                    reports/mops_parsed_filings.json 2>/dev/null || true
            if git diff --cached --quiet; then echo 'unchanged'; exit 0; fi
            git commit -m 'Pull: captured statutory note text and filing index'
            if git push origin "HEAD:$BR"; then exit 0; fi
            echo "push rejected, branch moved; replanting (attempt $attempt)"
            sleep 5
          done
          echo "could not push after three attempts"; exit 1
      - name: Keep the filings for one run
        if: steps.gate.outputs.run == 'true'

        uses: actions/upload-artifact@v4
        with:
          name: mops-pdfs
          path: cache/mops_pdf/
          retention-days: 5
          if-no-files-found: warn
# 2026-09-10: re-run to reach the 62 filings captured with zero note pages —
# every Fubon and Mercuries filing before 2020, every Cathay one before 2019.
# They were never examined: an empty record was written, `done` swallowed it,
# and the retry was locked out by the failure it existed to correct.
