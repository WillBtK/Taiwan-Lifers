# The statutory filings carry the two numbers the official hedge ratio is made
# of — 傳統避險本金 in the derivatives note, and the components of §三(九)'s
# denominator — and they are the ONLY route to a hedge-ratio history built the
# way the regulation defines it (decisions 4.49, 4.50).
#
# WHY THIS RUNS IN CI AND NOT IN THE SESSION
# doc.twse.com.tw answers with a WAF page ("FOR SECURITY REASONS") rather than
# a 4xx, and it has been blocking the development sandbox's egress IP for hours
# after an early burst. A runner has a different address and no such history.
# The same reasoning already puts probe-rpt-panel here.
#
# The download is a TWO-STEP: step=9 returns a small HTML page linking to
# /pdf/<name>_<timestamp>.pdf with a per-request timestamp, so the URL cannot be
# constructed. Reading that page as "not a PDF" is what stalled the first
# attempt (4.47).
name: pull-firm-statements
on:
  # workflow_dispatch alone is not enough: GitHub only accepts a dispatch for a
  # workflow present on the DEFAULT branch, and this one lives on the feature
  # branch. probe-rpt-panel solves it the same way — a push trigger on the
  # script's own path, so editing the puller runs it.
  # Deliberately NOT triggered by the parser script. Editing the parser used
  # to re-run a 60-minute index and two hours of rate-limited downloads to
  # re-read text the repository already holds; reparse-notes.yml does that
  # part in seconds. Start a real pull by editing THIS file, or by dispatch.
  push:
    branches: [claude/stage-1-fsc-sector-monthly-jh1pkf]
    paths:
      - '.github/workflows/pull-firm-statements.yml'
  workflow_dispatch:
    inputs:
      years:
        description: 'ROC years to index, space separated (blank = 115 down to 105, i.e. 2016-2026)'
        required: false
        default: ''
      gap:
        description: 'seconds between requests'
        required: false
        default: '8'
permissions:
  contents: write
concurrency:
  group: pull-firm-statements
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stage-1-fsc-sector-monthly-jh1pkf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the PDF reader
        run: pip install --quiet pymupdf
      # The index is cached in the repo, so a re-run costs only the filings it
      # has not already fetched.
      - name: Index the filings
        env:
          TLFX_MOPS_GAP: ${{ github.event.inputs.gap || '8' }}
          TLFX_MOPS_BLOCK_WAIT: '120'
          TLFX_MOPS_MIN_YEAR: '105'
        run: python3 scripts/stage6_firm_sensitivity.py ${{ github.event.inputs.years }}
      # The floor is set on BOTH steps so the download cannot wander outside
      # the range the index was built for, whatever an earlier run left behind.
      - name: Download and parse
        env:
          TLFX_MOPS_GAP: ${{ github.event.inputs.gap || '8' }}
          TLFX_MOPS_BLOCK_WAIT: '120'
          TLFX_MOPS_MIN_YEAR: '105'
        run: python3 scripts/stage6_firm_sensitivity.py pull
      # The PDFs are large and disposable; only the extracted numbers and the
      # filing index are committed.
      # always(): the filings cost minutes each to fetch, and the index is the
      # expensive half. A failure in the parse step must not throw away the
      # index and the rows that did parse, which is what a skipped commit did.
      - name: Commit the extracted numbers
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/mops_filing_index.json reports/mops_parsed_filings.json \
                  data/firm_sensitivity.csv data/firm_hedge_notional.csv \
                  data/mops_note_text.json.gz 2>/dev/null || true
          if git diff --cached --quiet; then echo 'unchanged'; else
            git commit -m 'Pull: firm statutory statements (rate/FX sensitivity, hedge notionals)'
            git pull --rebase origin claude/stage-1-fsc-sector-monthly-jh1pkf || true
            git push
          fi
      - name: Keep the filings for one run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mops-pdfs
          path: cache/mops_pdf/
          retention-days: 5
          if-no-files-found: warn
# 2026-09-10: re-run to reach the 62 filings captured with zero note pages —
# every Fubon and Mercuries filing before 2020, every Cathay one before 2019.
# They were never examined: an empty record was written, `done` swallowed it,
# and the retry was locked out by the failure it existed to correct.
