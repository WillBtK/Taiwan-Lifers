<title>Taiwan's Unhedged Dollar Book</title>
<style>

    --blue:    #5B93CC;

    --orange-soft: #3B2A20;
    --teal:    #2FA080;
    --teal-soft: #1D3630;
    --purple:  #8C6BC0;
  --gold:    #B08C38;
  --rose:    #CE7392;

/* ============================== BASE ============================== */
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body{

}

<script id="data-blob" type="application/json">/*DATA_BLOB*/</script>
<script>
const DATA = JSON.parse(document.getElementById('data-blob').textContent);
/* ============================================== THEME */
(function(){
  const btns = document.querySelectorAll('#themeToggle button');
  function apply(mode){
    if(mode === 'system'){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', mode); }
    btns.forEach(b => b.classList.toggle('active', b.dataset.t === mode));
    window.dispatchEvent(new Event('themechange'));
  }
  btns.forEach(b => b.addEventListener('click', () => apply(b.dataset.t)));
  apply('system');
})();
/* ============================================== HELPERS */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fmt(v, d=3){ if(v===null||v===undefined||isNaN(v)) return '—'; return v.toFixed(d); }
function fmtSigned(v, d=1){ if(v===null||v===undefined||isNaN(v)) return '—'; return (v>=0?'+':'')+v.toFixed(d); }
function signClass(v){ return v>=0 ? 'sign-pos' : 'sign-neg'; }
const tt = document.getElementById('tooltip');
function showTip(evt, html){
  tt.innerHTML = html; tt.classList.add('show');
  const x = evt.clientX, y = evt.clientY, pad = 16;
  tt.style.left='0px'; tt.style.top='0px';
  const rect = tt.getBoundingClientRect();
  let left = x+pad, top = y+pad;
  if(left+rect.width > window.innerWidth-10) left = x-rect.width-pad;
  if(top+rect.height > window.innerHeight-10) top = y-rect.height-pad;
  tt.style.left=left+'px'; tt.style.top=top+'px';
}
function hideTip(){ tt.classList.remove('show'); }
const SVGNS='http://www.w3.org/2000/svg';
function el(tag, attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function scaleLinear(domain,range){ const [d0,d1]=domain,[r0,r1]=range; const den=(d1-d0)||1; return v=>r0+(v-d0)/den*(r1-r0); }
function niceTicks(min,max,count){
  const span=(max-min)||1, step0=span/count, mag=Math.pow(10,Math.floor(Math.log10(step0))), norm=step0/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag; const ticks=[]; let t=Math.ceil(min/step)*step;
  for(;t<=max+1e-9;t+=step) ticks.push(Math.round(t*1e6)/1e6); return ticks;
}
function h(tag, attrs, kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='html') e.innerHTML=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(kids) (Array.isArray(kids)?kids:[kids]).forEach(c=> c!=null && e.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return e;
}
const COL = ()=>({blue:cssVar('--blue'),orange:cssVar('--orange'),teal:cssVar('--teal'),purple:cssVar('--purple'),gold:cssVar('--gold'),rose:cssVar('--rose'),ink:cssVar('--ink'),muted:cssVar('--muted'),faint:cssVar('--faint'),line:cssVar('--line'),line2:cssVar('--line-2'),surface:cssVar('--surface')});

/* ============================================== LINE CHART (crosshair) */
// opts: {series:[{label,color,dash,pts:[[x,y]]}], yZero, yFmt, xFmt, xTipFmt, ar, height, hideXaxis}
// ar = width:height ratio, default 1.6. Omit `height` unless a chart must match a
// sibling's pixel height exactly; `height` overrides `ar` and should be rare.
const CHARTS=[];
function lineChart(mount, opts){
  const render=()=>{ mount.innerHTML=''; drawLine(mount, opts); };
  render(); CHARTS.push(render);
}
function drawLine(mount, o){
  const C=COL();
  const W = mount.clientWidth || 560;
  const m={t:14,r:16,b:24,l:38};
  const all = o.series.flatMap(s=>s.pts);
  const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
  let ymin = Math.min(...ys), ymax = Math.max(...ys);
  if(o.yZero){ ymin=Math.min(ymin,0); ymax=Math.max(ymax,0); }
  const pad=(ymax-ymin)*0.08||1; ymin-=pad; ymax+=pad;
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const plotW=W-m.l-m.r;
  const H = o.height || Math.max(170, Math.round(W / (o.ar || 1.6)));
  const plotH=H-m.t-m.b;
  const sx=scaleLinear([xmin,xmax],[m.l,m.l+plotW]);
  const sy=scaleLinear([ymin,ymax],[m.t+plotH,m.t]);
  const svg=el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none'});
  const yt=niceTicks(ymin,ymax,4);
  const stepA = yt.length>1 ? Math.abs(yt[1]-yt[0]) : 1;
  const dec = stepA<0.1?2 : stepA<1?1 : 0;
  const axFmt = v => (Math.abs(v)<1e-9?'0':v.toFixed(dec));
  const tipFmt = o.yFmt || (v=>fmt(v,2));
  yt.forEach(t=>{
    const y=sy(t);
    svg.appendChild(el('line',{x1:m.l,x2:m.l+plotW,y1:y,y2:y,stroke:C.line2,'stroke-width':1}));
    const tx=el('text',{x:m.l-6,y:y+3,'text-anchor':'end'}); tx.textContent=axFmt(t); svg.appendChild(tx);
  });
  if(ymin<0&&ymax>0){ const y0=sy(0); svg.appendChild(el('line',{x1:m.l,x2:m.l+plotW,y1:y0,y2:y0,stroke:C.faint,'stroke-width':1.2})); }
  if(!o.hideXaxis){
    niceTicks(xmin,xmax,Math.min(6,Math.round(plotW/90))).forEach(t=>{
      if(t<xmin-0.5||t>xmax+0.5) return;
      const x=sx(t); const tx=el('text',{x:x,y:H-8,'text-anchor':'middle'}); tx.textContent=(o.xFmt?o.xFmt(t):Math.round(t)); svg.appendChild(tx);
    });
  }
  o.series.forEach(s=>{
    const d = s.pts.map((p,i)=> (i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
    svg.appendChild(el('path',{d,fill:'none',stroke:s.color,'stroke-width':s.width||2,'stroke-dasharray':s.dash||'','stroke-linejoin':'round','stroke-linecap':'round',opacity:s.dash?0.9:1}));
    const lp=s.pts[s.pts.length-1];
    if(!s.dash) svg.appendChild(el('circle',{cx:sx(lp[0]),cy:sy(lp[1]),r:3,fill:s.color}));
  });
  const cross=el('line',{x1:0,x2:0,y1:m.t,y2:m.t+plotH,stroke:C.faint,'stroke-width':1,opacity:0});
  svg.appendChild(cross);
  const dots=o.series.map(s=>{ const c=el('circle',{r:3.5,fill:s.color,stroke:C.surface,'stroke-width':1.5,opacity:0}); svg.appendChild(c); return c; });
  const rect=el('rect',{x:m.l,y:m.t,width:plotW,height:plotH,fill:'transparent'});
  svg.appendChild(rect);
  const xvals=[...new Set(xs)].sort((a,b)=>a-b);
  rect.addEventListener('mousemove',ev=>{
    const bb=svg.getBoundingClientRect(); const px=(ev.clientX-bb.left)*(W/bb.width);
    const xv=xvals.reduce((a,b)=>Math.abs(sx(b)-px)<Math.abs(sx(a)-px)?b:a,xvals[0]);
    cross.setAttribute('x1',sx(xv)); cross.setAttribute('x2',sx(xv)); cross.setAttribute('opacity',0.5);
    let rows='';
    o.series.forEach((s,i)=>{
      const pt=s.pts.find(p=>p[0]===xv);
      if(pt){ dots[i].setAttribute('cx',sx(pt[0])); dots[i].setAttribute('cy',sy(pt[1])); dots[i].setAttribute('opacity',1);
        rows+=`<div class="tt-row"><span class="l">${s.label}</span><span>${tipFmt(pt[1])}</span></div>`; }
      else dots[i].setAttribute('opacity',0);
    });
    const xTip=o.xTipFmt||o.xFmt;
    showTip(ev,`<div class="tt-title">${xTip?xTip(xv):Math.round(xv)}</div>${rows}`);
  });
  rect.addEventListener('mouseleave',()=>{ cross.setAttribute('opacity',0); dots.forEach(d=>d.setAttribute('opacity',0)); hideTip(); });
  mount.appendChild(svg);
}
function legend(items){ // items:[{label,color,dash}]
  const wrap=h('div',{class:'legend'});
  items.forEach(it=>{
    const mark = it.dash ? h('span',{class:'ln'}) : h('span',{class:'sw'});
    if(it.dash){ mark.style.background='none'; mark.style.borderTop='2px dashed '+it.color; mark.style.height='0'; }
    else mark.style.background=it.color;
    wrap.appendChild(h('span',{class:'item'},[mark, it.label]));
  });
  return wrap;
}
function series(frame,col,color,dash){ return {label:'',color,dash,pts:frame.index.map((x,i)=>[x,frame.columns[col][i]]).filter(p=>p[1]!=null)}; }
</script>
<script>
const M = document.getElementById('main');
const NAV = document.getElementById('jumpNav');

// One function per top-level page section. Call this once per section; it
// appends a <section class="panel"> to #main and a jump-link to the rail nav.
function panel(id, eyebrow, title, paras){
  const s=h('section',{class:'panel',id});
  const head=h('div',{class:'panel-head'});
  head.appendChild(h('span',{class:'eyebrow'},eyebrow));
  head.appendChild(h('h2',null,title));
  (paras||[]).forEach(p=> head.appendChild(h('p',{html:p})));
  s.appendChild(head); M.appendChild(s);
  NAV.appendChild(h('a',{href:'#'+id},title.length>32?title.slice(0,30)+'…':title));
  return s;
}

// ---- x-axis encoding + frequency-aware formatting -----------------------
const xYear=v=>String(Math.round(v));
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function xFmtQuarter(v){ const y=Math.floor(v+1e-6); const q=Math.round((v-y)*4)+1; return q+'Q'+String(y).slice(-2); }
function xFmtMonth(v){ const y=Math.floor(v+1e-6); const m=Math.round((v-y)*12); return MON3[m]+'-'+String(y).slice(-2); }
function xDateFromDoy(v){ const y=Math.floor(v); const doy=Math.round((v-y)*365.25); const d=new Date(Date.UTC(y,0,1)); d.setUTCDate(d.getUTCDate()+doy); return d; }
function xFmtDay(v){ const d=xDateFromDoy(v); return d.getUTCDate()+'-'+MON3[d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(-2); }
function xFmtMonthDoy(v){ const d=xDateFromDoy(v); return MON3[d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(-2); }
function xTipSpliced(cutover, recentFmt){ return v => v<cutover ? xYear(v) : recentFmt(v); }
function xy(a){ return a.map(p=>[p[0],p[1]]); }
function splice(annualXY, quarterlyXY, cutover){
  return annualXY.filter(p=>p[0]<cutover).concat(quarterlyXY.filter(p=>p[0]>=cutover));
}

/* ============================================== PAGE HELPERS (this page) */
// A chart card whose legend and series are rebuilt from live COL() on every
// redraw, so a theme switch recolours the legend swatches as well as the lines.
function chartCard(title, note, build, src){
  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},title));
  if(note) c.appendChild(h('div',{class:'card-note'},note));
  const lg=h('div'); const box=h('div',{class:'chartbox'});
  c.appendChild(lg); c.appendChild(box);
  if(src) c.appendChild(h('div',{class:'src'},src));
  const render=()=>{
    const o=build(COL());
    lg.innerHTML=''; box.innerHTML='';
    if(o.series.length>1) lg.appendChild(legend(o.series.map(s=>({label:s.label,color:s.color,dash:s.dash}))));
    drawLine(box,o);
  };
  render(); CHARTS.push(render);
  return c;
}
function table(cols, data, opts){
  const t=h('table');
  const tr=h('tr'); cols.forEach(c=>tr.appendChild(h('th',null,c.label))); t.appendChild(h('thead',null,tr));
  const tb=h('tbody');
  data.forEach(r=>{
    const row=h('tr',{class:(opts&&opts.hl&&opts.hl(r))?'hl':''});
    cols.forEach(c=>{
      const v=c.get(r); const cell=h('td',{html:v===null||v===undefined?'<span class="dim">—</span>':v});
      if(c.cls){ const k=c.cls(r); if(k) cell.classList.add(k); }
      row.appendChild(cell);
    });
    tb.appendChild(row);
  });
  t.appendChild(tb);
  return h('div',{class:'twrap'},t);
}
function tile(k, vHtml, d){
  const t=h('div',{class:'stat-tile'});
  t.appendChild(h('div',{class:'k'},k));
  const v=h('div',{class:'v'}); v.innerHTML=vHtml; t.appendChild(v);
  t.appendChild(h('div',{class:'d'},d));
  return t;
}
function callout(html, kind){ const c=h('div',{class:'callout'+(kind?' '+kind:'')}); c.innerHTML=html; return c; }
function more(summary, kids){
  const d=h('details',{class:'more'}); d.appendChild(h('summary',null,summary));
  const body=h('div',{class:'more-body'}); kids.forEach(k=>body.appendChild(k)); d.appendChild(body); return d;
}
const bn=v=>fmt(v,0);                      // whole billions
const pct=v=>fmt(v,1)+'%';
const pct0=v=>fmt(v,0)+'%';
const qLabel=d=>xFmtQuarter(DATA.exposure.find(e=>e.d===d)?DATA.exposure.find(e=>e.d===d).x:(+d.slice(0,4)+((+d.slice(5,7)-1)/3|0)/4));
const monLabel=m=>MON3[+m.slice(5,7)-1]+' '+m.slice(0,4);

const L=DATA.latest, X=DATA.exposure, LAST=X[X.length-1], FIRST=X[0];
const YR=X.find(e=>e.d==='2025-06-30');
const loss10=LAST.unhedged_ntd_tn*1000*0.10;
const eqDec=L.equity_bn, eqCbc=L.cbc_equity_last, buf=L.fsc_buffer_bn;
const may25=DATA.release.find(r=>r.m==='2025-05');
const regFirst=L.reg_ratio_first, regLast=L.reg_ratio_last;
const comp0=DATA.composition[0], comp1=DATA.composition[DATA.composition.length-1];
const peak=L.book_peak, bookLast=L.book_last;
const jan26=DATA.book_monthly.find(b=>b.m==='2026-01'), dec25=DATA.book_monthly.find(b=>b.m==='2025-12');
const cost23=DATA.cost_market.filter(p=>p[0]>=2023); const costAvg=cost23.reduce((a,p)=>a+p[1],0)/cost23.length;
const reg2504=DATA.fsc.reg_hedge_ratio.find(r=>r.m==='2025-04');

document.getElementById('railSub').textContent=
  `About ${pct0(L.unprot_pct)} of a US$${bn(L.fa_usd_bn)}bn foreign-currency book now runs without currency cover, and the book itself has not shrunk.`;
document.getElementById('footCredit').textContent=
  `TLFX. Built ${DATA.meta.built}. Sector data to ${monLabel(DATA.meta.sector_last_month)}, company disclosures to ${qLabel(L.as_of)}. Sources: FSC Insurance Bureau, Central Bank of the Republic of China (Taiwan), MOPS statutory filings, company investor decks, US Treasury TIC.`;

/* ============================================== 1. THE FINDING */
{
  const s=panel('exposure','The finding',
    `US$${bn(L.unhedged_usd_bn)}bn of foreign assets carry open currency risk, ${(L.unhedged_usd_bn/L.unhedged_usd_bn_year_ago).toFixed(1)} times a year ago`);
  const lede=h('p',{class:'lede'}); lede.innerHTML=
    `Taiwan's life insurers hold about <b>US$${bn(L.fa_usd_bn)}bn</b> of foreign-currency assets. On the companies' own disclosures, <b>${pct0(L.unprot_pct)}</b> of that — <b>US$${bn(L.unhedged_usd_bn)}bn</b>, NT$${fmt(L.unhedged_ntd_tn,1)}tn — is neither hedged with derivatives nor backed by foreign-currency policies. The share was ${pct0(FIRST.unprot_pct)} at the end of 2017 and ${pct0(YR.unprot_pct)} in June 2025. The open position has grown ${Math.round((L.unhedged_usd_bn/L.unhedged_usd_bn_year_ago-1)*100)}% in twelve months and the book has not been cut: it is within ${Math.round((1-L.fa_usd_bn/peak.fa_usd_bn)*100)}% of its ${monLabel(peak.m)} peak in dollars and larger in NT dollars.`;
  s.appendChild(lede);
  const nut=h('p',{class:'lede'}); nut.style.cssText='font-size:14.5px;margin-top:12px';
  nut.innerHTML=
    `This is the number that matters for spillovers. A sector that loses NT$${fmt(loss10/1000,1)}tn on a 10% move in the NT dollar has two ways out, and both move global markets: hedge late, selling dollars forward in a market where its own demand sets the price, or sell the underlying bonds — US Treasuries, agency mortgage securities and long corporate paper. May 2025 was the rehearsal: a ${fmt(may25.twd_ytd_pct,1)}% year-to-date appreciation produced a NT$${bn(-may25.fx_gl_ytd_bn)}bn foreign-exchange loss and ran the sector's FX reserve down to NT$${bn(may25.reserve_bn)}bn. The open position going into the next move is ${(LAST.unhedged_usd_bn/YR.unhedged_usd_bn).toFixed(1)} times what it was then.`;
  s.appendChild(nut);

  const row=h('div',{class:'stat-row'});
  row.appendChild(tile('Unhedged foreign assets', `US$${bn(L.unhedged_usd_bn)}bn <small>${qLabel(L.as_of)}</small>`,
    `NT$${fmt(L.unhedged_ntd_tn,2)}tn at ${fmt(L.usdtwd,2)} per dollar. US$${bn(L.unhedged_usd_bn_year_ago)}bn a year earlier, US$${bn(L.unhedged_usd_bn_2017)}bn at end-2017. Estimate: disclosing firms' share applied to the whole book.`));
  row.appendChild(tile('Share with no currency cover', `${pct(L.unprot_pct)} <small>of foreign assets</small>`,
    `Naked positions plus foreign equity, weighted across the ${L.n} firms that disclose the split (${pct0(L.cover)} of the sector's foreign assets). ${pct(L.unprot_pct_2017)} in December 2017.`));
  row.appendChild(tile('Foreign-currency book', `US$${bn(L.fa_usd_bn)}bn <small>${qLabel(L.as_of)}</small>`,
    `Regulator's monthly total, held from ${monLabel(bookLast.m)}. Peak US$${bn(peak.fa_usd_bn)}bn in ${monLabel(peak.m)}; NT$${fmt(bookLast.fa_ntd_bn/1000,1)}tn now against NT$${fmt(peak.fa_ntd_bn/1000,1)}tn then.`));
  row.appendChild(tile('Loss on a 10% NT$ rally', `NT$${fmt(loss10/1000,2)}tn`,
    `${pct0(loss10/eqDec*100)} of the sector's ${monLabel(L.equity_m)} equity of NT$${bn(eqDec)}bn, before hedge gains. The regulator's total buffer was NT$${bn(buf)}bn in ${monLabel(L.fsc_buffer_m)}.`));
  s.appendChild(row);

  const wrap=h('div'); wrap.style.cssText='margin-top:14px'; s.appendChild(wrap);
  wrap.appendChild(chartCard('The unhedged portion has tripled since 2017; the book it sits in has grown by less than half',
    'Quarterly, US$bn. Sector foreign investments converted at month-end USD/TWD; the unprotected share is the sector-weighted naked-plus-equity share of the firms disclosing it, applied to the whole book.',
    C=>({yZero:true, yFmt:v=>'US$'+fmt(v,0)+'bn', xFmt:xYear, xTipFmt:xFmtQuarter, ar:2.2, series:[
      {label:'Foreign-currency assets', color:C.blue, pts:X.map(e=>[e.x,e.fa_usd_bn])},
      {label:'Of which unhedged (estimate)', color:C.orange, pts:X.map(e=>[e.x,e.unhedged_usd_bn])},
    ]}),
    `Sources: FSC Insurance Bureau, 保險市場重要指標 表17-1 人身保險業資金運用表, monthly to ${monLabel(DATA.meta.sector_last_month)}; CBC month-end USD/TWD; hedging slides in Cathay, KGI, Shin Kong and Taiwan Life investor-conference decks and Fubon results decks, 2017-12 to 2026-06. Vintage ${DATA.meta.built}.`));

  const cov=X.map(e=>e.cover);
  wrap.appendChild(callout(
    `<b>Measured for part of the book, then scaled.</b> The unprotected share is observed directly for firms holding between ${pct0(Math.min(...cov))} and ${pct0(Math.max(...cov))} of the sector's foreign assets, depending on the quarter (${pct0(L.cover)} in 2026), and applied to the remainder. Fubon, about 15% of the sector, drops out from 2024 to 2025 because its slides for those quarters are not yet parsed; it is back in the 2026 figures, where its merged hedge-and-policy wedge covers ${pct0(DATA.firms_latest.find(f=>f.firm==='Fubon').fubon_b.protected)} of its foreign assets against ${pct0(comp1.hedged+comp1.policy)} for the four slide-publishing firms, which is most of the 2026 jump. The dollar amounts are estimates whose error is the gap between the disclosing firms and the silent ones, not sampling noise; the sector total and the exchange rate are the regulator's and the central bank's, complete.`,'orange'));
}

/* ============================================== 2. ARE THEY SELLING */
{
  const s=panel('book','Are they cutting the book?','The book is flat in dollars and rising in NT dollars',[
    `Cutting the risk by cutting the holdings would show here first, and it has not. Foreign investments were US$${bn(peak.fa_usd_bn)}bn in ${monLabel(peak.m)} and US$${bn(bookLast.fa_usd_bn)}bn in ${monLabel(bookLast.m)}; in NT dollars they rose from ${fmt(peak.fa_ntd_bn/1000,1)}tn to ${fmt(bookLast.fa_ntd_bn/1000,1)}tn over the same months. The January 2026 step down of about US$${bn(dec25.fa_usd_bn-jan26.fa_usd_bn)}bn coincides with the IFRS 17 opening balance sheet and had partly reversed by April; it does not look like a sale programme.`,
    `The adjustment so far has run through hedge ratios, not holdings. The sector has chosen to carry the currency risk rather than pay to remove it or sell the assets that create it. That is the messy-unwind configuration: a large, unhedged, still-growing dollar book held by institutions whose equity moves with the exchange rate.`]);
  const g=h('div',{class:'grid-2'}); s.appendChild(g);
  g.appendChild(chartCard(`In dollars: flat since 2021, ${Math.round((1-bookLast.fa_usd_bn/peak.fa_usd_bn)*100)}% below the ${monLabel(peak.m)} peak`,'Monthly, US$bn, at month-end USD/TWD.',
    C=>({yZero:true, yFmt:v=>'US$'+fmt(v,0)+'bn', xFmt:xYear, xTipFmt:xFmtMonth, series:[
      {label:'Foreign investments, US$bn', color:C.blue, pts:DATA.book_monthly.map(b=>[b.x,b.fa_usd_bn])}]}),
    'Source: FSC Insurance Bureau 表17-1; CBC USD/TWD.'));
  g.appendChild(chartCard('In NT dollars: still growing','Monthly, NT$tn, as published.',
    C=>({yZero:true, yFmt:v=>'NT$'+fmt(v,2)+'tn', xFmt:xYear, xTipFmt:xFmtMonth, series:[
      {label:'Foreign investments, NT$tn', color:C.blue, pts:DATA.book_monthly.map(b=>[b.x,b.fa_ntd_bn/1000])}]}),
    'Source: FSC Insurance Bureau 表17-1. The 2026 figures are unaudited per the table\'s own note.'));

  const tic=DATA.tic.filter(t=>t.year>=2019);
  const c=h('div',{class:'card'}); c.style.cssText='margin-top:14px';
  c.appendChild(h('div',{class:'card-title'},'Where forced selling would land: Taiwan\'s holdings of US long-term securities, US$bn'));
  c.appendChild(h('div',{class:'card-note'},'All Taiwan-resident holders, the central bank included; the survey publishes no holder split. Inference, not measurement: reserves sit mainly in Treasuries and agencies, so the corporate line and much of the agency line are the insurers\' likelier footprint.'));
  c.appendChild(table([
    {label:'June of', get:r=>String(r.year)},
    {label:'Total', get:r=>bn(r.total)},
    {label:'Treasuries', get:r=>bn(r.treasuries)},
    {label:'Agency (incl. MBS)', get:r=>bn(r.agency)},
    {label:'Corporate', get:r=>bn(r.corporate)},
    {label:'Equities', get:r=>bn(r.equities)},
  ], tic));
  c.appendChild(h('div',{class:'src'},'Source: US Treasury, Foreign Portfolio Holdings of US Securities, annual survey as of 30 June; 2023-25 rounded to the billion in the source.'));
  s.appendChild(c);
}

/* ============================================== 3. THE SHOCK */
{
  const s=panel('shock','The loss on a move',
    `A 10% appreciation costs NT$${fmt(loss10/1000,1)}tn, about ${pct0(loss10/eqDec*100)} of the sector's equity`,[
    `The arithmetic is linear: the NT-dollar value of an unhedged dollar asset falls by the appreciation. Against NT$${fmt(LAST.unhedged_ntd_tn,2)}tn of unprotected assets, 5% costs NT$${bn(loss10/2)}bn, 10% NT$${bn(loss10)}bn and 20% NT$${bn(loss10*2)}bn, before any gain on the hedges that remain or any release from the foreign-exchange reserve. The regulator's framing on ${monLabel(L.fsc_buffer_m)} numbers is that NT$${bn(buf)}bn of buffers absorb a ${fmt(L.fsc_absorb_pct,1)}% appreciation; its open position is NT$${fmt(L.fsc_net_open_tn,1)}tn against our NT$${fmt(LAST.unhedged_ntd_tn,1)}tn, so on our figure the absorbable move is nearer ${fmt(buf/(LAST.unhedged_ntd_tn*1000)*100,0)}%.`]);
  const moves=[5,10,15,20].map(p=>{ const loss=LAST.unhedged_ntd_tn*1000*p/100; return {p, loss, eq:loss/eqDec*100, eqc:eqCbc?loss/eqCbc.equity*100:null, bufx:loss/buf}; });
  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},'What each move costs, and against what'));
  c.appendChild(h('div',{class:'card-note'},`Loss = unprotected assets (NT$${fmt(LAST.unhedged_ntd_tn,2)}tn, ${qLabel(L.as_of)}) × appreciation. Equity on two bases: the FSC's ${monLabel(L.equity_m)} figure, the last before IFRS 17, and the CBC balance-sheet figure for ${eqCbc?monLabel(eqCbc.m):'—'}, after it. The regulator's buffer is its own ${monLabel(L.fsc_buffer_m)} total of reserve and related items.`));
  c.appendChild(table([
    {label:'NT$ appreciation', get:r=>fmt(r.p,0)+'%'},
    {label:'Loss, NT$bn', get:r=>bn(r.loss), cls:()=> 'sign-neg'},
    {label:`% of equity, ${monLabel(L.equity_m)} (NT$${bn(eqDec)}bn)`, get:r=>pct0(r.eq)},
    {label:`% of equity, ${eqCbc?monLabel(eqCbc.m):'—'} (NT$${eqCbc?bn(eqCbc.equity):'—'}bn)`, get:r=>r.eqc==null?null:pct0(r.eqc)},
    {label:`× regulator's buffer (NT$${bn(buf)}bn)`, get:r=>fmt(r.bufx,2)+'×'},
  ], moves, {hl:r=>r.p===10}));
  c.appendChild(h('div',{class:'src'},'Sources: exposure as in panel 1; FSC monthly release 保險業損益、淨值及匯兌損益情形 (equity, reserve); CBC Financial Statistics Monthly appendix table, life insurers\' balance sheet (equity, 2026); FSC Insurance Bureau press briefing figures as reported by 經濟日報 and 鉅亨網 (buffer, absorbable appreciation).'));
  s.appendChild(c);

  const rel=DATA.release, bal=DATA.balance;
  s.appendChild(chartCard('Equity fell by a quarter in the spring of 2025 and the FX reserve was nearly exhausted',
    'Monthly, NT$bn. Equity from the CBC balance sheet (identical to the FSC figure where both exist; the January 2026 step is the IFRS 17 opening balance). FX reserve from the FSC monthly release, to December 2025.',
    C=>({yZero:true, yFmt:v=>'NT$'+fmt(v,0)+'bn', xFmt:xYear, xTipFmt:xFmtMonth, ar:2.2, series:[
      {label:'Owners\' equity, life insurers', color:C.blue, pts:bal.filter(b=>b.equity!=null&&b.x>=2018).map(b=>[b.x,b.equity])},
      {label:'Foreign-exchange price reserve', color:C.orange, pts:rel.filter(r=>r.reserve_bn!=null).map(r=>[r.x,r.reserve_bn])},
    ]}),
    'Sources: CBC Financial Statistics Monthly, life insurance companies\' balance sheet; FSC monthly press releases, May 2018 to December 2025.'));

  s.appendChild(callout(
    `<b>May 2025 was the test, and cover was higher then.</b> With the NT dollar up ${fmt(may25.twd_ytd_pct,1)}% for the year, the sector booked a NT$${bn(-may25.fx_gl_ytd_bn)}bn foreign-exchange loss; hedging gains of NT$${bn(may25.hedge_gl_ytd_bn)}bn offset part of it, equity fell to NT$${bn(may25.equity_bn)}bn and the reserve to NT$${bn(may25.reserve_bn)}bn. The regulatory hedge ratio was ${fmt(reg2504.v,0)}% in April 2025 and ${fmt(regLast.v,0)}% in ${monLabel(regLast.m)}: the same move today produces a larger unhedged loss and a smaller hedging offset.`,'orange'));

  const cmp=[['2025-12','2025-12-31'],['2026-03','2026-03-31'],['2026-06','2026-06-30']].map(([m,d])=>{
    const f=DATA.fsc.net_open_fx.find(r=>r.m===m), o=X.find(e=>e.d===d); return {m, fsc:f?f.v:null, ours:o?o.unhedged_ntd_tn:null}; });
  s.appendChild(more('The regulator\'s own open-position figure, beside ours',[
    h('p',null,`The Insurance Bureau has stated a net open foreign-exchange position at its monthly briefings since December 2025. It is defined as foreign investments less foreign-currency policy liabilities less hedge principal. Ours counts the naked and foreign-equity slices of the disclosing firms' pies, scaled to the sector; the equity slice (${pct(comp1.equity)} of the disclosing firms' foreign assets) is inside our figure and, as non-FVTPL equity, outside the regulator's denominator. The two are close in December 2025 and diverge in 2026, when Fubon's low-cover pie enters our sample. Not yet reconciled.`),
    table([
      {label:'Month', get:r=>monLabel(r.m)},
      {label:'FSC net open FX, NT$tn', get:r=>r.fsc==null?null:fmt(r.fsc,2)},
      {label:'Ours, NT$tn', get:r=>r.ours==null?null:fmt(r.ours,2)},
      {label:'Difference', get:r=>(r.fsc==null||r.ours==null)?null:fmtSigned(r.ours-r.fsc,2), cls:r=>(r.fsc==null||r.ours==null)?'':signClass(r.ours-r.fsc)},
    ], cmp),
  ]));
}

/* ============================================== 4. WHY COVER CAME OFF */
{
  const s=panel('why','Why cover came off','Derivative hedging halved since 2017; policy backing did not fill the gap',[
    `Two things could have made a falling derivatives ratio harmless: more foreign-currency policies behind the assets, or fewer assets. Neither happened. Across the four firms that publish the full split, the hedged share fell from ${pct0(comp0.hedged)} to ${pct0(comp1.hedged)} while the policy-backed share moved from ${pct0(comp0.policy)} to ${pct0(comp1.policy)}; the naked share rose from ${pct0(comp0.naked)} to ${pct0(comp1.naked)}. The regulator's ratio tells the same story faster: ${fmt(regFirst.v,0)}% in ${monLabel(regFirst.m)}, ${fmt(regLast.v,0)}% in ${monLabel(regLast.m)}.`,
    `The proximate causes are cost and rules. Three-month forward cover has cost ${fmt(costAvg,1)}% a year on average since 2023, against a book yielding not much more than that over funding. In February 2026 the FSC let insurers run a four-bucket foreign-exchange reserve and, from financial year 2026, amortise the exchange differences on amortised-cost bonds instead of taking them through earnings. Both lower the accounting penalty for running an open position. Neither changes the economic one, which is the subject of this page.`]);
  const comp=DATA.composition;
  s.appendChild(chartCard('The naked share has risen from a seventh of the book to two fifths',
    `Quarterly, % of foreign-currency assets, sector-weighted over the firms that publish all four slices (Cathay, KGI, Shin Kong, Taiwan Life; ${pct0(comp1.cover)} of sector foreign assets at the last date). The four lines sum to 100.`,
    C=>({yZero:true, yFmt:v=>fmt(v,1)+'%', xFmt:xYear, xTipFmt:xFmtQuarter, ar:2.0, series:[
      {label:'Hedged with derivatives', color:C.blue, pts:comp.map(c=>[c.x,c.hedged])},
      {label:'Backed by FX policies', color:C.orange, dash:'4 3', pts:comp.map(c=>[c.x,c.policy])},
      {label:'Naked', color:C.teal, pts:comp.map(c=>[c.x,c.naked])},
      {label:'Foreign equity and funds', color:C.purple, dash:'4 3', pts:comp.map(c=>[c.x,c.equity])},
    ]}),
    'Sources: company investor-conference decks, hedging-structure slide, 2017-12 to 2026-06; firm weights from the Insurance Bureau\'s per-firm fund-utilisation table and the decks\' own stated foreign-asset totals.'));

  const ag=DATA.aggregate, fsc=DATA.fsc, cbc=DATA.cbc;
  s.appendChild(chartCard('Four readings of the derivatives-only hedge ratio agree on the direction and roughly on the level',
    'Quarterly and monthly, %. Ours (mixed) weights nine firms and is an upper bound where notional-only firms carry weight; ours (deck-only) is the four slide-publishing firms. The FSC ratio is the regulator\'s own, on a narrower denominator that nets out policy liabilities and unhedged equity. The CBC footnote is hedges outstanding over foreign assets, 2012 to 2026.',
    C=>({yZero:true, yFmt:v=>fmt(v,1)+'%', xFmt:xYear, xTipFmt:v=>(v<2017?xFmtMonth(v):xFmtQuarter(v)), ar:2.0, series:[
      {label:'Ours, all nine firms (upper bound)', color:C.blue, pts:ag.filter(a=>a.mixed!=null).map(a=>[a.x,a.mixed])},
      {label:'Ours, four slide-publishing firms', color:C.orange, dash:'4 3', pts:ag.filter(a=>a.deck!=null).map(a=>[a.x,a.deck])},
      {label:'FSC regulatory ratio', color:C.teal, pts:fsc.reg_hedge_ratio.map(r=>[r.x,r.v])},
      {label:'CBC footnote, hedges / foreign assets', color:C.purple, dash:'4 3', pts:cbc.map(c=>[c.x,c.ratio])},
    ]}),
    'Sources: our aggregate from company decks and MOPS statutory filings (data/aggregate_hedge_ratio*.csv); FSC Insurance Bureau briefing figures as reported by 經濟日報, 鉅亨網 and others, 2024-04 to 2026-07; CBC Financial Statistics Monthly, life insurers\' balance-sheet footnote, archived vintages 2012 to 2026.'));

  const g=h('div',{class:'grid-2'}); g.style.cssText='margin-top:14px'; s.appendChild(g);
  g.appendChild(chartCard('What three-month cover costs in the forward market','Monthly, % a year, from the CBC\'s published 90-day forward against spot (mid). Positive = it costs a Taiwan-dollar investor to sell dollars forward. The June 2025 print, with the forward above spot after an 8% fall in spot over two months, is the source\'s figure as published.',
    C=>({yZero:true, yFmt:v=>fmtSigned(v,2)+'% p.a.', xFmt:xYear, xTipFmt:xFmtMonth, series:[
      {label:'Forward-implied hedge cost, 3m', color:C.blue, pts:DATA.cost_market}]}),
    'Source: CBC, forward exchange rates (10 to 180 days) and spot, monthly.'));
  g.appendChild(chartCard('What Fubon says it actually paid','Quarterly, basis points of foreign-currency assets a year, recurring hedging cost only (excludes the FX gain or loss and one-offs).',
    C=>({yZero:true, yFmt:v=>fmt(v,0)+' bp', xFmt:xYear, xTipFmt:xFmtQuarter, series:[
      {label:'Fubon Life recurring hedge cost', color:C.blue, pts:DATA.fubon_cost.map(p=>[p[0],p[1]])}]}),
    'Source: Fubon Financial results decks, 經常性避險成本, 2014 to 2Q26; legend-colour bound and sum-verified against the deck\'s total FX result.'));
}

/* ============================================== 5. WHO CARRIES IT */
{
  const fl=DATA.firms_latest;
  const s=panel('firms','Who carries it','The three largest books have the least cover; five firms disclose only a ceiling',[
    `${fl.slice(0,3).map(f=>f.firm).join(', ')} hold ${pct0(fl.slice(0,3).reduce((a,f)=>a+f.weight,0))} of the sector's foreign assets between them and run derivative cover of ${fl.slice(0,3).map(f=>pct0(f.ratio)).join(', ')}. The firms that draw a pie (Cathay, KGI, Shin Kong, Taiwan Life) report their hedged slice directly. Nan Shan, Fubon, Mercuries, Bank Taiwan and Hontai publish only the size of their currency-derivative book in the statutory accounts, and that figure is at or above the slide in every one of the ${L.paired_n} firm-quarters where a company publishes both, so for them the ratio shown is a ceiling.`]);
  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},'Latest reading per firm'));
  c.appendChild(h('div',{class:'card-note'},'Weight is the firm\'s share of sector foreign investments. "Protected" is hedged plus policy-backed; "open" is naked plus foreign equity. Fubon\'s deck merges hedged and policy-backed into one wedge, so its protected figure is direct and its derivatives figure is the statutory ceiling.'));
  c.appendChild(table([
    {label:'Firm', get:f=>f.firm},
    {label:'Weight', get:f=>pct(f.weight)},
    {label:'Derivatives cover', get:f=>pct(f.ratio)},
    {label:'Measure', get:f=>f.measure==='slide'?'slide':'ceiling'},
    {label:'Protected (hedged + policy)', get:f=>f.pie?pct(f.pie.hedged_pct+f.pie.fx_policy_pct):f.fubon_b?pct(f.fubon_b.protected):null},
    {label:'Open (naked + equity)', get:f=>f.pie?pct(f.pie.naked_pct+f.pie.equity_pct):f.fubon_b?pct(f.fubon_b.naked+f.fubon_b.equity):null, cls:f=>(f.pie||f.fubon_b)?'sign-neg':''},
    {label:'As of', get:f=>xFmtQuarter(f.x)},
  ], fl));
  c.appendChild(h('div',{class:'src'},'Sources: company decks (slide); MOPS statutory financial statements, derivative-instrument notes, gross notional of currency swaps, forwards and NDFs over the firm\'s foreign investments (ceiling); Insurance Bureau per-firm fund utilisation (weights).'));
  s.appendChild(c);

  const order=['Cathay','Nan Shan','Fubon','Shin Kong','KGI','Taiwan Life'];
  const wrap=h('div'); wrap.style.cssText='margin-top:14px'; s.appendChild(wrap);
  wrap.appendChild(chartCard('Every large firm has come down; the slide-publishing firms are all now between 20% and 33%',
    'Quarterly, derivatives-only hedge ratio, % of foreign assets. Solid lines with a slide measure are direct readings; Nan Shan and Fubon are statutory ceilings. Mercuries, Bank Taiwan and Hontai are in the table above and omitted here for legibility.',
    C=>{ const cols=[C.blue,C.orange,C.teal,C.purple,C.gold,C.rose];
      return {yZero:true, yFmt:v=>fmt(v,1)+'%', xFmt:xYear, xTipFmt:xFmtQuarter, ar:1.9,
        series:order.map((n,i)=>({label:n+(DATA.measure[n]==='ceiling'?' (ceiling)':''), color:cols[i], dash:(i%2?'4 3':''), pts:(DATA.firm_ratio[n]||[]).map(p=>[p[0],p[1]])}))}; },
    'Sources: as for the table. Each line is the firm\'s contribution to the sector aggregate, interpolated across gaps of up to four quarters.'));
}

/* ============================================== 6. METHOD AND LIMITS */
{
  const J=DATA.jpm;
  const haveA=J.filter(j=>j.ours_hedge!=null), exact=haveA.filter(j=>Math.abs(j.ours_hedge-j.jpm_hedge)<0.05), close=haveA.filter(j=>{const d=Math.abs(j.ours_hedge-j.jpm_hedge); return d>=0.05&&d<=0.5;}), off=haveA.filter(j=>Math.abs(j.ours_hedge-j.jpm_hedge)>0.5);
  const haveB=J.filter(j=>j.ours_protected!=null), exactB=haveB.filter(j=>Math.abs(j.ours_protected-j.jpm_protected)<=0.15);
  const byFirm=[...new Set(J.map(j=>j.firm))].map(f=>({firm:f, n:J.filter(j=>j.firm===f).length, a:J.filter(j=>j.firm===f&&j.ours_hedge!=null).length, b:J.filter(j=>j.firm===f&&j.ours_protected!=null).length}));
  const s=panel('method','Method and limits','Two measures, a ceiling, and a 55-cell check against JP Morgan',[
    `The sector series is built from what each firm discloses, and that is not one thing. Four insurers draw a pie with a hedged slice; five report a derivative notional in the accounts and no pie. Where a firm publishes both (Shin Kong, Taiwan Life), the notional is at or above the slide in ${L.paired_ceiling} of ${L.paired_n} quarters: by 2–3% for Shin Kong, by up to 150% for Taiwan Life, whose currency-contract book does more than hedge its bonds. The all-firm line is therefore an upper bound wherever notional-only firms carry weight, and the four-firm line is the like-for-like measure over a smaller share of the sector. The truth sits between them, nearer the lower.`,
    `A JP Morgan workbook of ${L.jpm_cells} firm-quarter hedge readings (five firms, eleven dates, 2018-12 to 2025-06) is held as a benchmark and never ingested. On the derivatives-only measure we have a reading for ${haveA.length} of the ${J.length} cells: ${byFirm.map(f=>f.firm+' '+f.a+' of '+f.n).join(', ')}. Of those ${haveA.length}, ${exact.length} are identical, ${close.length} are within half a point and ${off.length} ${off.length===1?'differs':'differ'} by more${off.length?' ('+off.map(o=>o.firm+' '+xFmtQuarter(o.x)+': JP Morgan '+pct(o.jpm_hedge)+', ours '+pct(o.ours_hedge)+'; their denominator is the year-end figure against a nine-month structure').join('; ')+')':''}. Fubon's zero is the merged wedge: on the hedged-plus-policy measure we match ${exactB.length} of the ${haveB.length} cells we can form, Fubon's included.`]);

  s.appendChild(callout(
    `<b>What would change the conclusion.</b> (1) If the silent firms — Nan Shan above all, ${pct0(DATA.firms_latest.find(f=>f.firm==='Nan Shan').weight)} of the sector — carry materially more policy backing than the disclosing four, the sector's unprotected share is lower than ${pct0(L.unprot_pct)}; the regulator's NT$${fmt(L.fsc_net_open_tn,1)}tn against our NT$${fmt(LAST.unhedged_ntd_tn,1)}tn puts a scale on that. (2) Fubon's 2026 wedge is read as hedged-plus-policy on the deck's own label; if the label has narrowed to derivatives only, Fubon's open share is overstated and so is the 2026 jump. (3) Foreign-currency policy liabilities are a hedge only while policyholders keep them in foreign currency; a surrender wave in a rally converts that backing into open exposure. (4) The dollar figures use month-end spot; a 3% move in the rate moves them 3%. None of these reverses the direction: derivative cover has fallen by half on every measure, and the book has not shrunk.`,'orange'));

  const c=h('div',{class:'card'}); c.style.cssText='margin-top:14px';
  c.appendChild(h('div',{class:'card-title'},'Accounts against slide: every quarter where a firm publishes both'));
  c.appendChild(h('div',{class:'card-note'},'Gross currency-derivative notional from the statutory financial statements over the firm\'s foreign investments, beside the hedged slice of the same quarter\'s investor deck. A ratio above 1 means the accounts figure exceeds the slide.'));
  c.appendChild(table([
    {label:'Firm', get:p=>p.firm},
    {label:'Quarter', get:p=>xFmtQuarter(+p.d.slice(0,4)+((+p.d.slice(5,7)-1)/3|0)/4)},
    {label:'From accounts', get:p=>pct(p.accounts)},
    {label:'From slide', get:p=>pct(p.slide)},
    {label:'Ratio', get:p=>fmt(p.ratio,2)+'×', cls:p=>p.ratio>=1?'sign-neg':'sign-pos'},
  ], DATA.paired));
  c.appendChild(h('div',{class:'src'},'Sources: MOPS statutory statements (derivative-instrument notes); Shin Kong and Taiwan Life investor decks.'));
  s.appendChild(c);

  s.appendChild(more('The 55-cell benchmark grid, cell by cell',[
    h('p',null,'JP Morgan\'s hedge column is derivatives only; its policy column is separate. Ours are the same two slices from the decks, or for Fubon the merged wedge shown under "protected". A blank means we hold no reading for that firm and date.'),
    table([
      {label:'Firm', get:j=>j.firm},
      {label:'Quarter', get:j=>xFmtQuarter(j.x)},
      {label:'JPM hedged', get:j=>pct(j.jpm_hedge)},
      {label:'Ours hedged', get:j=>j.ours_hedge==null?null:pct(j.ours_hedge), cls:j=>j.ours_hedge==null?'':(Math.abs(j.ours_hedge-j.jpm_hedge)<=0.5?'sign-pos':'sign-neg')},
      {label:'JPM hedged + policy', get:j=>j.jpm_protected==null?null:pct(j.jpm_protected)},
      {label:'Ours hedged + policy', get:j=>j.ours_protected==null?null:pct(j.ours_protected), cls:j=>(j.ours_protected==null||j.jpm_protected==null)?'':(Math.abs(j.ours_protected-j.jpm_protected)<=0.5?'sign-pos':'sign-neg')},
    ], J),
    h('p',{class:'tbl-note'},'Source: JP Morgan hedging-structure workbook (benchmark file, data/benchmark_jpm_hedging_structure.csv), held for validation only; our readings from the decks named above.'),
  ]));

  s.appendChild(more('Sources and vintages',[
    h('p',null,`Sector foreign investments and total assets: FSC Insurance Bureau, 保險市場重要指標 表17-1, monthly January 2017 to ${monLabel(DATA.meta.sector_last_month)}. Equity, FX reserve, FX and hedging gains and losses: FSC monthly press release 保險業損益、淨值及匯兌損益情形, May 2018 to December 2025. Regulatory hedge ratio, net open position, buffer total and absorbable appreciation: Insurance Bureau monthly briefing figures as reported in 經濟日報 and 鉅亨網, April 2024 to July 2026 (press-reported; the Bureau does not print them). Balance-sheet equity and foreign assets: CBC Financial Statistics Monthly, life insurance companies' balance sheet, and its hedging footnote in archived vintages from 2012.`),
    h('p',null,'Firm hedging structure: investor-conference decks of Cathay Financial, KGI Financial (formerly China Development), Shin Kong Financial and CTBC Financial (Taiwan Life), hedging-structure slide, 2016 to 2026; Fubon Financial results decks, 2014 to 2026. Firm derivative notionals: statutory financial statements filed on MOPS, derivative-instrument notes, translated at CBC month-end rates where stated in foreign currency. Firm weights: Insurance Bureau per-firm fund-utilisation table and Wayback Machine snapshots of it. USD/TWD and forward rates: CBC. US holdings: US Treasury TIC annual survey. Benchmark: JP Morgan hedging-structure workbook, five firms, eleven dates.'),
    h('p',null,`Everything on this page is computed from data/*.csv in the TLFX repository by scripts/stage8_artifact_blob.py; the decisions log (docs/decisions.md, entries 4.1 to 4.82) records each reading choice. Built ${DATA.meta.built}.`),
  ]));
}

window.addEventListener('themechange',()=>{ CHARTS.forEach(fn=>fn()); });
